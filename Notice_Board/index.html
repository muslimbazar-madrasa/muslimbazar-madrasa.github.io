<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নোটিশ বোর্ড | Notice Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-crest" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 6c4 4 6 8 6 12a6 6 0 1 1-12 0c0-4 2-8 6-12Z" fill="currentColor"/>
          <rect x="22.5" y="2" width="3" height="6" rx="1" fill="currentColor"/>
          <path d="M8 40v-9a16 16 0 0 1 32 0v9H8Z" fill="currentColor"/>
          <rect x="6" y="40" width="36" height="3" rx="1.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="header-text">
       <!-- <p class="header-eyebrow">প্রাতিষ্ঠানিক ঘোষণা</p> -->
        <h1 class="header-title">নোটিশ বোর্ড</h1>
        <!-- <p class="header-sub">Notice Board — সকল প্রজ্ঞাপন ও ঘোষণা এক জায়গায়</p> -->
      </div>
    </div>
  </header>

  <!-- ===== Controls: search + filter ===== -->
  <section class="controls" aria-label="অনুসন্ধান ও ফিল্টার">
    <div class="controls-inner">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <line x1="16.65" y1="16.65" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="শিরোনাম বা বিষয় লিখে খুঁজুন..." aria-label="নোটিশ খুঁজুন">
      </div>

      <div class="filter-box">
        <label for="categoryFilter" class="filter-label">বিভাগ</label>
        <select id="categoryFilter" aria-label="বিভাগ অনুযায়ী ফিল্টার করুন">
          <option value="all">সকল বিভাগ</option>
          <option value="Exam">পরীক্ষা (Exam)</option>
          <option value="Exam Fee">পরীক্ষার ফি (Exam Fee)</option>
          <option value="Holiday">ছুটি / বন্ধ (Holiday)</option>
          <option value="Program">প্রোগ্রাম (Program)</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ===== Main content ===== -->
  <main class="main-content">

    <!-- Loading spinner -->
    <div id="loadingState" class="loading-state">
      <div class="spinner" role="status" aria-label="লোড হচ্ছে"></div>
      <p>নোটিশ লোড হচ্ছে...</p>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">
      <p>কোনো নোটিশ পাওয়া যায়নি।</p>
    </div>

    <!-- Notice grid -->
    <div id="noticeGrid" class="notice-grid" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="footerYear"></span> — সকল স্বত্ব সংরক্ষিত</p>
  </footer>

  <!-- ===== Modal: Notice Pad ===== -->
  <div id="noticeModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="notice-pad">
      <button id="modalClose" class="modal-close" aria-label="বন্ধ করুন">&times;</button>

      <!-- Letterhead banner -->
      <div class="pad-letterhead">
        <div class="letterhead-crest" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 6c4 4 6 8 6 12a6 6 0 1 1-12 0c0-4 2-8 6-12Z" fill="currentColor"/>
          <rect x="22.5" y="2" width="3" height="6" rx="1" fill="currentColor"/>
          <path d="M8 40v-9a16 16 0 0 1 32 0v9H8Z" fill="currentColor"/>
          <rect x="6" y="40" width="36" height="3" rx="1.5" fill="currentColor"/>
        </svg>
      </div>
        <div class="letterhead-text">
          <p class="letterhead-institute">প্রতিষ্ঠানের নাম বসবে এখানে</p>
          <p class="letterhead-address">ঠিকানা, শহর — Institute Address Placeholder</p>
        </div>
      </div>

      <!-- Watermark -->
      <svg class="pad-watermark" aria-hidden="true" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 6c4 4 6 8 6 12a6 6 0 1 1-12 0c0-4 2-8 6-12Z" fill="currentColor"/>
        <rect x="22.5" y="2" width="3" height="6" rx="1" fill="currentColor"/>
        <path d="M8 40v-9a16 16 0 0 1 32 0v9H8Z" fill="currentColor"/>
        <rect x="6" y="40" width="36" height="3" rx="1.5" fill="currentColor"/>
      </svg>

      <!-- Body -->
      <div class="pad-body">
        <span id="modalCategory" class="badge"></span>
        <h2 id="modalTitle" class="pad-title"></h2>
        <p id="modalDate" class="pad-date"></p>
        <div id="modalDetails" class="pad-details"></div>
      </div>

      <!-- Signature footer -->
      <div class="pad-footer">
        <div id="signatureBlock" class="signature-block"></div>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
